# ============================================================================
#  Uploader configuration
#
#  HOW TO USE: rename this file to "config.ini" (remove the ".en" from the
#  name) and fill in the [server] and [job] sections.
#
#  The program never shows any window or dialog; everything is written to
#  the logs\ folder.
# ============================================================================

[general]
# Log folder (relative to the program folder)
log_dir = logs
# How many days to keep logs
log_keep_days = 30
# Incremental state folder (size + modification time of files from last run)
state_dir = state
# Retry count and delay for a failed upload
max_retries = 3
retry_delay_ms = 2000

[server]
# Server address: IP or domain name
host = your-server-ip-or-domain
port = 21
# FTP account
user = your-ftp-user
password = your-ftp-password

# tls: auto = encrypt when the server supports it | require = must encrypt | off = plaintext
tls = auto
# Certificate validation: keep false for a self-signed certificate. After --test
# prints the SHA256 fingerprint, put it in tls_fingerprint and set this to true.
tls_verify = false
# Certificate SHA256 fingerprint (64 hex characters, no colons)
tls_fingerprint =
# Root folder of the FTP account
remote_root = /

# Allow plaintext FTP. Default false: if the server is not encrypted the agent
# only writes a log line, never logs in and never syncs.
allow_plaintext = false
# Network timeout in seconds
timeout_sec = 30

[schedule]
# The following keys drive the task registered by install-task.bat
on_logon = true
daily_times = 09:00, 18:00
repeat_minutes = 0
task_name = FolderSyncer

# ============================================================================
#  Sync jobs: each [job:name] maps one local folder to one server folder
# ============================================================================
[job:example]
enabled = false
# Local folder to sync (no trailing backslash)
local = D:\your-folder
# Target folder on the server; "/" means the FTP account root
remote = /your-folder

# mirror = files deleted locally are moved to the server trash
# upload = only upload new/changed files, never delete anything on the server
mode = upload

# true = also remove files on the server that do not exist locally (risky, default false)
strict_mirror = false

delete_to_trash = true
trash_dir = /_trash
trash_keep_days = 30

# Exclude rules, separated by semicolons. A pattern without "/" matches a file
# name; one with "/" matches a relative path; a trailing "/" excludes a folder.
exclude = ~$*; *.tmp; Thumbs.db; desktop.ini; .DS_Store; *.swp; *.lock

# Per-file size limit in MB, 0 = unlimited; larger files are skipped
max_file_mb = 0
# Content hash verification: the uploader records SHA256, the archiver compares
# it after download and deletes the server copy only when they match
verify_hash = true

# ============================================================================
#  Auto-update: check GitHub Releases for a newer version
# ============================================================================
[update]
# Enable the update check
enabled = true
repo = Bright9025/folder-syncer
# Minimum hours between two checks
check_hours = 24
# Which package to download: auto (by role) / upload / archive
asset = auto
