# ============================================================================
#  上传端配置（第一次使用请先填写 [server] 和 [job] 部分）
#
#  这个文件随程序一起提供，填好就能用。
#  程序全程不弹窗，所有结果写到 logs\ 下。
# ============================================================================

[general]
# 日志目录（相对程序目录）
log_dir = logs
# 日志保留天数
log_keep_days = 30
# 增量状态目录（记录上次同步时每个文件的大小和时间）
state_dir = state
# 单个文件上传失败的重试次数和间隔
max_retries = 3
retry_delay_ms = 2000

[server]
# 服务器地址：IP 或域名
host = 你的服务器IP或域名
port = 21
# FTP 账号
user = 你的FTP账号
password = 你的FTP密码

# tls: auto = 服务器支持就加密 | require = 必须加密 | off = 不加密
tls = auto
# 服务器证书校验：自签证书先设 false；跑 --test 拿到指纹后填进 tls_fingerprint 再把这里改回 true
tls_verify = false
# 证书 SHA256 指纹（64 位十六进制，不带冒号）
tls_fingerprint =
# FTP 账号的根目录
remote_root = /

# 是否允许明文 FTP。默认 false：服务器没加密时只写日志、不登录、不同步
allow_plaintext = false
# 网络超时（秒）
timeout_sec = 30

[schedule]
# 下面这组影响 install-task.bat 注册的计划任务
on_logon = true
daily_times = 09:00, 18:00
repeat_minutes = 0
task_name = FolderSyncer

# ============================================================================
#  同步任务：一个 [job:名字] 就是一组「本地目录 -> 服务器目录」
# ============================================================================
[job:示例]
enabled = false
# 本地要同步的目录（结尾不要加 \）
local = D:\你的目录
# 服务器上的目标目录，"/" 就是 FTP 账号根目录
remote = /你的目录

# mirror = 本地删除的文件，服务器上移进回收站
# upload = 只上传新增和修改，从不删除服务器文件
mode = upload

# true = 服务器上「本地没有」的文件也清掉（危险，默认 false）
strict_mirror = false

delete_to_trash = true
trash_dir = /_trash
trash_keep_days = 30

# 排除规则：分号分隔；不含 / 的匹配文件名，含 / 的匹配相对路径，以 / 结尾表示整个目录
exclude = ~$*; *.tmp; Thumbs.db; desktop.ini; .DS_Store; *.swp; *.lock

# 单文件大小上限（MB），0 = 不限制；超过的文件自动跳过
max_file_mb = 0
# 内容哈希校验：上传端记录 SHA256，保存端下载后比对，一致才删服务器副本
verify_hash = true

# ============================================================================
#  自动更新：从 GitHub Releases 检查新版本
# ============================================================================
[update]
# 是否开启自动检查更新
enabled = true
repo = Bright9025/folder-syncer
# 两次检查之间的最小间隔（小时）
check_hours = 24
# 取哪个发布包：auto（按当前角色）/ upload / archive
asset = auto
