; ============================================================================
;  保存端配置（第一次使用请先填写 [server] 和 [job] 部分）
;
;  这个文件随程序一起提供，填好就能用。
;  保存端会把服务器上的文件拉回本地、删掉服务器副本，并更新「已归档清单」。
; ============================================================================

[general]
log_dir = logs
state_dir = state
max_retries = 2

[server]
; 必须和上传端的 [server] 完全一致
host = 你的服务器IP或域名
port = 21
user = 你的FTP账号
password = 你的FTP密码
tls = auto
tls_verify = false
tls_fingerprint =
remote_root = /
allow_plaintext = false
timeout_sec = 60
; 服务器上存放清单的目录（两端默认一致）
manifest_dir = /_foldersyncer

[schedule]
; archive = 保存端（拉取并删除服务器副本）
mode = archive
task_name = FolderSyncer-Archive
on_logon = true
; 想固定时间跑就填，比如 02:00
daily_times =
; 每隔多少分钟跑一次（0 = 不重复）
repeat_minutes = 30

; ============================================================================
;  要归档的服务器目录 -> 本地存档目录
; ============================================================================
[job:示例]
enabled = false
; 本地存档位置：按原来的相对路径存放；内容变化时旧版本进 _history\<时间>\
local = D:\你的存档
; 服务器上要拉取的目录，要和上传端的 remote 一致
remote = /你的目录
