# ============================================================================
#  Archiver configuration
#
#  HOW TO USE: rename this file to "archive.ini" (remove the ".en" from the
#  name) and fill in the [server] and [job] sections.
#
#  The archiver pulls files from the server into a local archive, deletes the
#  server copies and updates the "archived" manifest.
# ============================================================================

[general]
log_dir = logs
state_dir = state
max_retries = 2

[server]
# Must be identical to the uploader's [server] section
host = your-server-ip-or-domain
port = 21
user = your-ftp-user
password = your-ftp-password
tls = auto
tls_verify = false
tls_fingerprint =
remote_root = /
allow_plaintext = false
timeout_sec = 60
# Folder on the server that stores the manifests (both sides must match)
manifest_dir = /_foldersyncer

[schedule]
# archive = archiver role (pull and delete the server copies)
mode = archive
task_name = FolderSyncer-Archive
on_logon = true
# Fill this in to also run at fixed times, e.g. 02:00
daily_times =
# Run every N minutes (0 = do not repeat)
repeat_minutes = 30

# ============================================================================
#  Server folder to archive -> local archive folder
# ============================================================================
[job:example]
enabled = false
# Local archive root: files keep their relative paths; when content changes the
# previous version is moved to _history\<timestamp>\
local = D:\your-archive
# Folder on the server to pull, must match the uploader's remote
remote = /your-folder

# Per-file size limit in MB, 0 = unlimited; larger files are skipped and stay on the server
max_file_mb = 0
# Content hash verification: compare the SHA256 recorded by the uploader
verify_hash = true

# ============================================================================
#  Auto-update: check GitHub Releases for a newer version
# ============================================================================
[update]
# Enable the update check
enabled = true
repo = Bright9025/folder-syncer
# Minimum hours between two checks
check_hours = 24
# Which package to download: auto (by role) / upload / archive
asset = auto
